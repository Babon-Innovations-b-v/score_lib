[project]
name = "score-lib"
version = "1.0.0"
description = "A library of locked, reusable parts across every OpenUSD layer of a SCORE world"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "usd-core",
    "numpy",
    "pillow",
    "matplotlib",
    "jsonschema",
    "boto3",
    "soundfile",
    "huggingface-hub>=1.2",
    "scipy>=1.17.1",
]

[project.scripts]
score-lib = "score_lib.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/score_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
