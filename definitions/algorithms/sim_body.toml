tests = ["score/stages/sim_body/test_a_body_doing_its_clip_stands_on_its_ground_within_its_residual.py", "score/stages/sim_body/inside/rra/test_rra_moves_mass_and_torso_by_the_mean_residual.py"]
picture = []
requires = ["newton==1.7.0", "mujoco==3.15.0", "mujoco-warp==3.15.0", "warp-lang==1.18.0", "usd-core==26.8", "numpy==2.5.3", "scipy==1.18.1", "python-fcl==0.7.0.11", "mink==1.3.0", "qpsolvers==4.13.0", "daqp==0.10.3"]
test_requires = ["pillow", "trimesh", "rtree", "embreex"]

