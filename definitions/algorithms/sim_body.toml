# One engine algorithm of world 1 (README.md, Layout); read by score_lib/export/algorithm.py.
# The walkers' physics (score #56, #65, #128): a person's clip played by a musculoskeletal body on its scene's ground.
name = "sim_body"
title = "Sim body: each person a MyoFullBody doing its clip on its scene's ground, residuals reduced by RRA and gated"
entry = "score.stages.sim_body:make"
bake = ["score.stages.sim_body:write_layer"]
roots = ["score/stages/sim_body/__init__.py", "score/stages/sim_body/inside/sim_body.py"]
search = ["score/stages/sim_body/inside"]
constants = ["score/stages/sim_body/_gates.py:SUNK_MOST", "score/stages/sim_body/_gates.py:LANDED", "score/stages/sim_body/_gates.py:CONTACT", "score/stages/sim_body/_gates.py:CARRIED", "score/stages/sim_body/_gates.py:FOLLOWED", "score/stages/sim_body/_gates.py:RESIDUAL_FORCE", "score/stages/sim_body/_gates.py:RESIDUAL_MOMENT", "score/stages/sim_body/_gates.py:MOVE_MOST", "score/stages/sim_body/inside/rra/__init__.py:RRA_ROUNDS", "score/stages/sim_body/inside/rra/__init__.py:TRACK", "score/stages/sim_body/inside/rra/__init__.py:COM_MOST", "score/stages/sim_body/inside/rra/__init__.py:RRA_HALVINGS", "score/stages/sim_body/inside/rra/__init__.py:MASS_MOST"]
preset = ["data/physics/bodies.json", "data/physics/materials.json"]
stage = "sim-body"
contract = ["sim-body", 2]
needs = ["a CUDA card (Newton, Warp and MuJoCo Warp): about 2 minutes a clip on an L4"]
