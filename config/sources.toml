# Where an entry's content comes from, and whether it may go out under the library's one licence (MIT, LICENSE).
# The rule (owner, 2026-10-18): everything in the library is MIT; what cannot be released under MIT is not let in.
#
#   output  what the source makes may be released under MIT (our own work, or a model or tool whose terms give us
#           its output)
#   copy    the source's own bytes may be copied into an entry under MIT (only when its terms allow relicensing)
#
# An entry names its sources in provenance.made_with; a source missing here, or one used in a way its row does not
# allow, is refused. A source whose own bytes may not be copied in stays outside: an algorithm names it as an outside
# requirement (definitions/algorithms/<name>.toml `outside`). `match` lists the exact credit texts the score data
# writes for the source. A row is added only from the source's real terms, named in `from`.

[[source]]
id = "score"
name = "made by score (code, bakes, layouts, records)"
output = true
copy = true
match = ["made for the first world, the repository's own (MIT)"]
why = "our own work, released under MIT"
from = "score LICENSE (MIT, Babon Innovations B.V. and contributors); data/sound/licences.json (tools/sound/made.py sounds)"

[[source]]
id = "framework_models"
name = "models made by the framework's routes for world 1"
output = true
copy = true
match = ["made for the first world (the game 2099) by this framework's routes; released with the repository under MIT, though whether a model made with AI tools can carry copyright at all is an open question"]
why = "made by our routes (code-built pieces, or Pixal3D meshes from our own pictures); the release manifest releases them under MIT"
from = "score data/assets/world1.json licences at fddaa273c268a69084eea24e3036bae64a91a978, release world1-assets-5 (every rule carries this text)"

